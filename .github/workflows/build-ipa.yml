name: Build unsigned IPA (TrollStore)

# 手动触发（Actions 页面点 Run workflow），或推送到 main/master 时自动构建。
# 产物：TVBox-unsigned.ipa —— 未签名，可直接用巨魔 TrollStore 安装。
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build TVBox.ipa
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 确认 Xcode 环境
        run: |
          # 尽量切到完整版 Xcode；路径不存在时不要直接失败。
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app || true
          fi
          echo "当前开发者目录: $(xcode-select -p)"
          xcodebuild -version
          echo "--- 可用的 iPhoneOS SDK ---"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 用 project.yml 生成 Xcode 工程
        run: xcodegen generate

      - name: 打印关键构建设置（确认最低系统版本）
        run: |
          echo "=== project.yml 里声明的 SWIFT_VERSION ==="
          grep -n "SWIFT_VERSION" project.yml || true
          echo ""
          echo "=== 工程实际生效的设置 ==="
          BUILD_SETTINGS=$(xcodebuild -project tvbox.xcodeproj -scheme tvbox -showBuildSettings -sdk iphoneos \
            | grep -E "IPHONEOS_DEPLOYMENT_TARGET|PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME|SWIFT_VERSION|SWIFT_STRICT_CONCURRENCY" || true)
          echo "$BUILD_SETTINGS"
          DEPLOYMENT_TARGET=$(printf '%s\n' "$BUILD_SETTINGS" \
            | awk -F ' = ' '/IPHONEOS_DEPLOYMENT_TARGET/ { print $2; exit }')
          if [ "$DEPLOYMENT_TARGET" != "15.0" ]; then
            echo "::error::iOS deployment target 必须是 15.0，当前为 ${DEPLOYMENT_TARGET:-未读取到}"
            exit 1
          fi
          echo ""
          echo "=== tvbox 目录下的源文件是否都被工程收录 ==="
          # pbxproj 里存的是文件名（不含目录），因此按 basename 检查。
          (cd tvbox && find . -name '*.swift' -exec basename {} \; | sort -u) | while IFS= read -r name; do
            if grep -q "$name" tvbox.xcodeproj/project.pbxproj; then
              echo "OK  $name"
            else
              echo "!!  $name 未被工程收录（检查 project.yml 的 sources 排除项）"
            fi
          done

      - name: 预解析 SwiftPM 依赖（VLCKit，失败重试）
        run: |
          for i in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project tvbox.xcodeproj -scheme tvbox; then
              echo "依赖解析成功"
              exit 0
            fi
            echo "第 $i 次解析失败，10 秒后重试…"
            sleep 10
          done
          echo "::error::SwiftPM 依赖解析失败（VLCKit 二进制包下载失败）"
          exit 1

      - name: 归档构建（关闭代码签名）
        run: |
          rm -rf build
          set +e
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme tvbox \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/tvbox.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO > build.log 2>&1 || true
          echo "=== xcodebuild 退出码已忽略，交由下一步判定 ==="
          tail -5 build.log

      # 归档步骤用了 `|| true`，所以这里必须用 always()：否则构建失败时
      # 该步骤会被直接跳过，Summary/Annotations 永远不会产出（之前就是这样）。
      - name: 提取构建日志摘要（写入 Summary + Annotations）
        if: always()
        run: |
          echo "=== 诊断信息 ==="
          echo "- build.log 是否存在: $([ -f build.log ] && echo yes || echo no)"
          echo "- build.log 行数: $(wc -l < build.log 2>/dev/null || echo 0)"
          echo ""
          if [ ! -f build.log ]; then
            echo "build.log 未生成，跳过摘要"
            exit 0
          fi

          # 过滤两类无害噪音：AppIntents 元数据解析的假 error、SWIFT preflight note。
          ERRORS=$(grep -E "error:|fatal error:" build.log 2>/dev/null \
            | grep -vE "Build description parse error|Skipping preflight" \
            | sed -e "s|$GITHUB_WORKSPACE/||" \
            | awk '!seen[$0]++')

          if [ -z "$ERRORS" ]; then
            echo "未发现构建错误行"
            exit 0
          fi

          # 供后续步骤决定是否上传日志。
          echo "HAS_BUILD_ERRORS=1" >> "$GITHUB_ENV"

          {
            echo "## Xcode 构建错误摘要"
            echo ""
            echo "### error 行（按出现顺序去重，最多 60 条）"
            echo ""
            echo '```text'
            echo "$ERRORS" | head -60
            echo '```'
            echo ""
            echo "### 日志最后 80 行"
            echo ""
            echo '```text'
            tail -80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

          # 把前 9 条错误行逐条输出为 Annotations（匿名可经 GitHub API 读取，
          # Summary 区块需要登录才能看）。每步注解上限 10 条，取 9 条留余量。
          echo "$ERRORS" | head -9 | cut -c1-400 \
            | while IFS= read -r line; do
                esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
                echo "::error::$esc"
              done

      - name: 失败时上传构建日志
        if: always() && env.HAS_BUILD_ERRORS == '1'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 判定构建结果
        run: |
          if [ ! -f build.log ]; then
            echo "::error::build.log 未生成，xcodebuild 未正常执行"
            exit 1
          fi
          # 判定前先过滤两类无害噪音行：
          # 1) "Build description parse error"（AppIntents 元数据解析的假 error，不影响产物）
          # 2) "Skipping preflight"（SWIFT 优化级别的 note）
          if grep -vE "Build description parse error|Skipping preflight" build.log \
             | grep -qE "error:|\*\* ARCHIVE FAILED \*\*"; then
            echo "::error::归档构建失败，详见本次运行的 Job Summary"
            exit 1
          fi
          if [ ! -d "build/tvbox.xcarchive" ]; then
            echo "::error::构建未产出 .xcarchive"
            tail -40 build.log
            exit 1
          fi
          echo "归档成功"

      - name: 打包成未签名 IPA
        run: |
          set -euo pipefail

          APP_PATH=$(find build/tvbox.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::归档产物里没找到 .app"
            ls -R build/tvbox.xcarchive/Products || true
            exit 1
          fi
          echo "找到 App：$APP_PATH"

          APP_NAME=$(basename "$APP_PATH")
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" "build/Payload/$APP_NAME"

          # 去掉可能残留的签名目录
          rm -rf "build/Payload/$APP_NAME/_CodeSignature"

          # ad-hoc 签名（可选）：签好后在 TrollStore / AltStore 下都更省心。
          # 若失败，就清掉残留签名目录，改由 TrollStore 安装时自行签名（一样能装）。
          if codesign --force --deep --sign - "build/Payload/$APP_NAME" 2>/dev/null; then
            echo "ad-hoc 签名完成"
          else
            echo "ad-hoc 签名失败，交由 TrollStore 安装时签名"
            find "build/Payload/$APP_NAME" -name "_CodeSignature" -type d -prune -exec rm -rf {} + || true
          fi

          echo "=== 关键信息 ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "build/Payload/$APP_NAME/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "build/Payload/$APP_NAME/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "build/Payload/$APP_NAME/Info.plist" || true
          echo "=== Payload 结构 ==="
          ls -la "build/Payload/$APP_NAME"

          cd build
          rm -f TVBox-unsigned.ipa
          zip -qry TVBox-unsigned.ipa Payload

          echo "=== 产物 ==="
          ls -lh TVBox-unsigned.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-unsigned-ipa
          path: build/TVBox-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
